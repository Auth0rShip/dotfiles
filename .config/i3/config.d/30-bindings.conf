# Use pactl to adjust volume in PulseAudio.
#set $refresh_i3status killall -SIGUSR1 i3status
#bindsym XF86AudioRaiseVolume exec --no-startup-id pactl set-sink-volume @DEFAULT_SINK@ +5% && $refresh_i3status
#bindsym XF86AudioLowerVolume exec --no-startup-id pactl set-sink-volume @DEFAULT_SINK@ -5% && $refresh_i3status
#bindsym XF86AudioMute exec --no-startup-id pactl set-sink-mute @DEFAULT_SINK@ toggle && $refresh_i3status
#bindsym XF86AudioMicMute exec --no-startup-id pactl set-source-mute @DEFAULT_SOURCE@ toggle && $refresh_i3status
bindsym XF86AudioRaiseVolume exec --no-startup-id pactl set-sink-volume @DEFAULT_SINK@ +3%
bindsym XF86AudioLowerVolume exec --no-startup-id pactl set-sink-volume @DEFAULT_SINK@ -3%
bindsym XF86AudioMute exec --no-startup-id pactl set-sink-mute @DEFAULT_SINK@ toggle
bindsym XF86AudioMicMute exec --no-startup-id pactl set-source-mute @DEFAULT_SOURCE@ toggle

# Start a terminal.
#bindsym $mod+Return exec termite
bindsym $mod+Return exec alacritty

# Kill the focused window.
bindsym $mod+Shift+q kill

# Lock the screen.
#bindsym $mod+Shift+x exec --no-startup-id light-locker-command -l
#bindsym $mod+Shift+x exec betterlockscreen -i /usr/share/pixmaps/my_picture/fgo2.png
bindsym $mod+Shift+x exec --no-startup-id betterlockscreen -l dimblur
#bindsym $mod+Shift+x exec dm-tool lock

# Start the application launcher.
bindsym $mod+d exec --no-startup-id "rofi -show combi"
#bindcode $mod+40 exec "rofi -modi drun,run -show drun"
#bindcode $mod+40 exec --no-startup-id i3-dmenu-desktop

# Open clipboard history.
bindsym $mod+c exec --no-startup-id rofi -modi "clipboard:greenclip print" -show clipboard

# Change focus.
bindsym $mod+h focus left
bindsym $mod+j focus down
bindsym $mod+k focus up
bindsym $mod+l focus right

# Alternatively, use the cursor keys.
bindsym $mod+Left focus left
bindsym $mod+Down focus down
bindsym $mod+Up focus up
bindsym $mod+Right focus right

# Move the focused window.
bindsym $mod+Shift+h move left
bindsym $mod+Shift+j move down
bindsym $mod+Shift+k move up
bindsym $mod+Shift+l move right

# Alternatively, use the cursor keys.
bindsym $mod+Shift+Left move left
bindsym $mod+Shift+Down move down
bindsym $mod+Shift+Up move up
bindsym $mod+Shift+Right move right

# Split orientation.
bindsym $mod+b split h
bindsym $mod+v split v

# Toggle fullscreen.
bindsym $mod+f fullscreen toggle

# Change container layout.
bindsym $mod+s layout stacking
bindsym $mod+w layout tabbed
bindsym $mod+e layout toggle split

# Toggle tiling/floating and focus between them.
bindsym $mod+Shift+space floating toggle
bindsym $mod+space focus mode_toggle

# Focus parent container.
bindsym $mod+a focus parent
#bindsym $mod+d focus child

# Scratchpad.
bindsym $mod+shift+m move scratchpad
bindsym $mod+m scratchpad show

# Reload and restart i3.
bindsym $mod+Shift+c reload
bindsym $mod+Shift+r restart

# Exit i3 (logs you out of your X session).
bindsym $mod+Shift+e exec "i3-nagbar -t warning -m 'You pressed the exit shortcut. Do you really want to exit i3? This will end your X session.' -B 'Yes, exit i3' 'i3-msg exit'"

# Shutdown mode. Its entry binding remains disabled, matching the original
# configuration above.
#bindsym $mod+Shift+e mode "SHUTDOWN SEQUENCE"
mode "SHUTDOWN SEQUENCE"{
    bindsym p exec "systemctl poweroff"
    bindsym r exec "systemctl reboot"
    bindsym Return exec "default"
    bindsym Escape exec "default"
    bindsym $mod+Shift+e exec "default"
}

# Resize window (you can also use the mouse for that).
mode "resize" {
    # These bindings trigger as soon as you enter resize mode.
    bindsym j resize shrink width 10 px or 10 ppt
    bindsym k resize grow height 10 px or 10 ppt
    bindsym l resize shrink height 10 px or 10 ppt
    bindsym semicolon resize grow width 10 px or 10 ppt

    # Same bindings, but for the arrow keys.
    bindsym Left resize shrink width 10 px or 10 ppt
    bindsym Down resize grow height 10 px or 10 ppt
    bindsym Up resize shrink height 10 px or 10 ppt
    bindsym Right resize grow width 10 px or 10 ppt

    # Back to normal: Enter, Escape, or $mod+r.
    bindsym Return mode "default"
    bindsym Escape mode "default"
    bindsym $mod+r mode "default"
}

bindsym $mod+r mode "resize"

# Tool launcher mode.
mode "TOOLS" {
    bindsym b exec --no-startup-id burpsuite, mode "default"
    bindsym f exec --no-startup-id thunar, mode "default"
    bindsym g exec --no-startup-id ghidra, mode "default"
    bindsym q exec --no-startup-id virt-manager, mode "default"
    bindsym v exec --no-startup-id virtualbox, mode "default"
    bindsym w exec --no-startup-id wireshark, mode "default"

    bindsym Return mode "default"
    bindsym Escape mode "default"
}

bindsym $mod+shift+z mode "TOOLS"

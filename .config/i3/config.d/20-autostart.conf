# Start XDG autostart .desktop files using dex. See also
# https://wiki.archlinux.org/index.php/XDG_Autostart
#exec --no-startup-id dex --autostart --environment i3

exec --no-startup-id fcitx5

exec_always --no-startup-id picom -b
exec_always --no-startup-id dunst -config ~/.config/dunst/dunstrc

exec --no-startup-id ~/.screenlayout/main.sh

# xss-lock grabs a logind suspend inhibit lock and uses i3lock to lock the
# screen before suspend. Use loginctl lock-session to lock your screen.
exec --no-startup-id xss-lock -- betterlockscreen -l

# NetworkManager is a desktop environment-independent system tray GUI.
exec --no-startup-id nm-applet

# Clipboard history daemon
exec --no-startup-id greenclip daemon>/dev/null

# Start Polybar. The commented block is the previous i3bar configuration.
#bar {
#            position top
#            status_command ~/.config/conky/launch.sh
#            tray_output primary
#}
exec_always --no-startup-id $HOME/.config/polybar/launch.sh

# Restore wallpaper.
exec --no-startup-id ~/.fehbg

# Optional terminal session restore.
#exec --no-startup-id konsole --restore
